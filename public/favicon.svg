<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="128" fill="#0a0a0a" />
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="#262626" stroke-width="8" />
  
  <!-- Outer Glow Arc / Pulse Ring -->
  <circle cx="256" cy="256" r="180" stroke="url(#brand-grad)" stroke-width="12" stroke-dasharray="28 14" opacity="0.4" />
  
  <!-- Main StreamPulse Play Icon (Rounded Polygon) with Glow -->
  <path d="M210 160 C210 148 224 140 234 146 L356 242 C366 250 366 262 356 270 L234 366 C224 372 210 364 210 352 Z" fill="url(#brand-grad)" filter="url(#glow)" />
  
  <!-- Pulse Accent Wave Dot -->
  <circle cx="150" cy="256" r="16" fill="#fbbf24" opacity="0.8" />
  <circle cx="110" cy="256" r="10" fill="#fbbf24" opacity="0.4" />
</svg>
